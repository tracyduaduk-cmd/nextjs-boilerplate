name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * 1,4' # Runs every Monday & Thursday at midnight UTC
  workflow_dispatch:      # Allows manually triggering the run anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/faqs?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
            
